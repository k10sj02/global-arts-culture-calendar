[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-arts-culture-calendar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "icalendar>=6.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
global-arts-culture-calendar = "global_arts_culture_calendar:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
